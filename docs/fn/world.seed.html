<h1>world.seed()</h1>

<span class="sig">world.seed()</span>

<p>Returns the primary world's random seed as a string.</p>

<h2>Parameters</h2>
<p>None.</p>

<h2>Returns</h2>
<p>A string containing the seed, preserving its full 64-bit value.</p>

<h2>Example</h2>
<pre><code>log("World seed:", world.seed())</code></pre>
