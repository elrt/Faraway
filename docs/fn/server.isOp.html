<h1>server.isOp()</h1>

<span class="sig">server.isOp(name)</span>

<p>Checks whether the named player is an operator.</p>

<h2>Parameters</h2>
<table>
  <tr><th>Name</th><th>Type</th><th>Description</th></tr>
  <tr><td><code>name</code></td><td>string</td><td>Player name.</td></tr>
</table>

<h2>Returns</h2>
<p>A boolean.</p>

<h2>Example</h2>
<pre><code>if server.isOp("Alex") then
  log("Alex is an operator")
end</code></pre>
