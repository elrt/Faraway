<h1>region:players()</h1>

<span class="sig">region:players()</span>

<p>Finds all online players currently inside the region.</p>

<h2>Parameters</h2>
<p>None.</p>

<h2>Returns</h2>
<p>An array of player wrappers.</p>

<h2>Example</h2>
<pre><code>local pList = myRegion:players()
for _, p in ipairs(pList) do
  p:send("The arena match is starting!")
end</code></pre>
