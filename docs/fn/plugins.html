<h1>plugins()</h1>

<span class="sig">plugins()</span>

<p>Returns an array of all currently loaded plugin names.</p>

<h2>Parameters</h2>
<p>None.</p>

<h2>Returns</h2>
<p>An array of strings.</p>

<h2>Example</h2>
<pre><code>local loaded = plugins()
log("There are " .. #loaded .. " plugins running.")</code></pre>
